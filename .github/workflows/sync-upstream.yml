# Watches upstream FUTO Keyboard for new releases, merges them into this fork,
# and builds + publishes a signed APK as a GitHub Release.
#
# Flow:
#   1. Find the newest stable upstream tag (e.g. 0.1.31, skips -rc tags).
#   2. If it is already part of master -> stop (nothing to do).
#   3. Merge it into master. On conflict -> abort, open an issue, stop.
#   4. Push master, build the release APK, publish it as a GitHub Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of your .jks keystore
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

name: Sync upstream release

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and publish even if there is no new upstream release"
        type: boolean
        default: false

permissions:
  contents: write # push master, create releases
  issues: write   # report merge conflicts

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/futo-org/android-keyboard.git
  BRANCH: master
  FLAVOR: Unstable # Unstable | Stable | Playstore
  NDK_VERSION: 28.2.13676358

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0 # full history: needed for merging and for versionCode
          submodules: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --force

      - name: Check for new upstream release
        id: check
        run: |
          TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "Already merged."
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "build=${{ inputs.force_build == true }}" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release
        if: steps.check.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          if git merge --no-edit -m "Merge upstream release $TAG" "$TAG"; then
            git push origin "HEAD:$BRANCH"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort
            TITLE="Upstream release $TAG has merge conflicts"
            if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$TITLE" --body "$(printf 'Automatic merge of upstream `%s` into `%s` failed.\n\nConflicting files:\n```\n%s\n```\n\nResolve locally:\n```\ngit fetch %s --tags\ngit merge %s\n```' "$TAG" "$BRANCH" "$CONFLICTS" "$UPSTREAM_URL" "$TAG")"
            fi
            echo "::error::Merge conflict with upstream $TAG"
            exit 1
          fi

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }} # includes the merge pushed by the sync job
          fetch-depth: 0
          submodules: false

      - name: Fetch submodules (with LFS)
        run: |
          git lfs install
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule foreach --recursive git lfs pull

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing - see the header of this workflow file."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > key.jks
          {
            echo "storeFile=key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        env:
          TAG: ${{ needs.sync.outputs.tag }}
        run: |
          export VERSION_CODE=$(git rev-list --first-parent --count HEAD)
          export VERSION_NAME="$TAG-fork.$VERSION_CODE"
          export BRANCH_NAME="$BRANCH"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew "assemble${FLAVOR}Release" --no-daemon --stacktrace
          FLAVOR_LC=$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')
          APK=$(find build/outputs/apk/$FLAVOR_LC/release -name '*.apk' | head -n 1)
          mv "$APK" "futo-keyboard-$FLAVOR_LC-$VERSION_NAME.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.sync.outputs.tag }}
        run: |
          gh release create "$VERSION_NAME" futo-keyboard-*.apk \
            --target "$(git rev-parse HEAD)" \
            --title "FUTO Keyboard $VERSION_NAME" \
            --notes "Based on upstream release [$TAG](https://github.com/futo-org/android-keyboard/releases/tag/$TAG), merged into this fork."

      - name: Clean up signing files
        if: always()
        run: rm -f key.jks keystore.properties
